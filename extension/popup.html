<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body { font-family:sans-serif; margin:0; width:300px; background:#060d1a; color:#e6f1ff; }
  header { padding:10px; background:#081224; color:#00d4ff; font-weight:600; border-bottom:1px solid #1c2a44; }
  .row { padding:10px; border-bottom:1px solid #1c2a44; font-size:13px; }
  button { width:100%; background:#00d4ff; color:#000; border:none; padding:8px; border-radius:4px; font-weight:600; cursor:pointer; margin-bottom:6px; }
  button.ghost { background:transparent; color:#e6f1ff; border:1px solid #1c2a44; }
  #status, #diag { font-size:11px; color:#7a8aa0; margin-top:6px; white-space:pre-wrap; max-height:180px; overflow:auto; font-family:monospace; }
</style></head><body>
<header>B2C DW Sync</header>
<div class="row">
  <div id="site" style="font-size:12px; color:#7a8aa0; margin-bottom:6px">—</div>
  <button id="btnSync">Sync now</button>
  <button class="ghost" id="btnDiagnose">Diagnose (if no rows sync)</button>
  <div id="status"></div>
  <div id="diag"></div>
</div>
<div class="row">
  <button class="ghost" id="btnOptions">Settings</button>
</div>
<script src="popup.js"></script>
</body></html>
